name = "cloudssh"
main = "src/worker/index.ts"
compatibility_date = "2026-07-01"
workers_dev = true

# 自定义域名（Workers Custom Domain）：workers.dev 在部分网络不可用，
# 自定义域名由 Cloudflare 自动签发证书并创建 DNS 记录
routes = [
  { pattern = "ssh.lemonhub.online", custom_domain = true }
]

[vars]
DEBUG_MODE = "false"

# 构建监视路径：仅源代码变动时触发重新构建
[build]
watch_dir = "."

# 下述注释的配置推荐采用环境变量的形式在 Cloudflare Dashboard 中直接添加：
# - GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET（GitHub OAuth）
# - GITHUB_ALLOWED_USER_IDS（可选，逗号分隔的 GitHub 数字用户 ID 白名单）
# - REQUIRE_GITHUB_AUTH（可选，true 时禁用匿名 SSH，要求 GitHub 登录）
# - ENABLE_SSH_SHARING（可选，true 时允许登录用户创建一次性 SSH 分享）
# - TURNSTILE_SECRET / TURNSTILE_SITEKEY（Bot 验证）
# - BASE_URL（OAuth 回调地址，需与实际域名一致）
# - IDLE_TIMEOUT（可选，用户无操作空闲超时，如 30m / 1h，设为 0 禁用，默认 30m）
# - ENABLE_P2P（可选，true 时开放 Agent 注册/信令 API，登录用户可经
#   自托管 Agent 以 WebRTC DataChannel 直连 SSH 主机；未启用时全部走中继）
# - TURN_KEY_ID / TURN_API_TOKEN（可选，Cloudflare Realtime TURN key；
#   缺失时 P2P 仅下发公共 STUN，对称 NAT/UDP 受限网络无法直连）
# - TURN_EXTRA_URIS / TURN_EXTRA_USERNAME / TURN_EXTRA_CREDENTIAL（可选，
#   逗号分隔的自建 TURN 地址与静态凭据，追加进 iceServers 作为回退候选）

[[durable_objects.bindings]]
name = "SSH_SESSION"
class_name = "SSHSessionDO"

[[durable_objects.bindings]]
name = "USER_DB"
class_name = "UserDBDO"

[[durable_objects.bindings]]
name = "SSH_SHARE"
class_name = "SSHShareDO"

# 首次部署及后续迁移通过 migration tag 初始化 SQLite Durable Object 类；
# 已有环境新增或变更 DO 类时必须追加新的、不可复用的 migration tag
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SSHSessionDO", "UserDBDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SSHShareDO"]

# ========== Test 环境 ==========
# test 分支部署到独立 Worker；DO 类绑定相同，但实例与数据和生产环境隔离
# 自定义域名请在 Cloudflare Dashboard 中手动绑定
[env.test]
name = "cloudssh-test"

[env.test.vars]
DEBUG_MODE = "true"

[[env.test.durable_objects.bindings]]
name = "SSH_SESSION"
class_name = "SSHSessionDO"

[[env.test.durable_objects.bindings]]
name = "USER_DB"
class_name = "UserDBDO"

[[env.test.durable_objects.bindings]]
name = "SSH_SHARE"
class_name = "SSHShareDO"
