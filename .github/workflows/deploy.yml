name: Deploy to Cloudflare Workers

on:
  push:
    branches: [test, main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "AGENTS.md"

jobs:
  deploy:
    if: github.repository_owner == 'vexuni'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: "11.8.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Type check
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Browser E2E and accessibility tests
        run: pnpm run test:e2e

      - name: Build frontend and deploy (test)
        if: github.ref == 'refs/heads/test'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:test

      - name: Sync TURN API token secret (test)
        if: github.ref == 'refs/heads/test'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
        run: |
          if [ -z "$CF_TURN_API_TOKEN" ]; then
            echo "CF_TURN_API_TOKEN secret not configured; skipping"
          else
            printf '%s' "$CF_TURN_API_TOKEN" | pnpm exec wrangler secret put TURN_API_TOKEN --env test
          fi

      - name: Build frontend and deploy (production)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

      - name: Sync TURN API token secret (production)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
        run: |
          if [ -z "$CF_TURN_API_TOKEN" ]; then
            echo "CF_TURN_API_TOKEN secret not configured; skipping"
          else
            printf '%s' "$CF_TURN_API_TOKEN" | pnpm exec wrangler secret put TURN_API_TOKEN
          fi

      - name: Post-deploy smoke check (production)
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          BASE="https://ssh.lemonhub.online"
          echo "==> GET /api/health"
          curl -sf --max-time 20 "$BASE/api/health" | grep -q '"ok"\|"status"' && echo ok
          echo "==> GET /api/config (expect p2pEnabled)"
          curl -sf --max-time 20 "$BASE/api/config" | grep -q '"p2pEnabled":true' && echo ok
          echo "==> GET /install.sh"
          curl -sf --max-time 20 "$BASE/install.sh" | head -1 | grep -q '#!/bin/sh' && echo ok
          echo "==> GET /install.ps1"
          curl -sf --max-time 20 "$BASE/install.ps1" | grep -qi 'param(' && echo ok
          echo "==> HEAD /api/agent/download/cloudssh-agent-linux-x64"
          curl -sfI --max-time 30 "$BASE/api/agent/download/cloudssh-agent-linux-x64" | head -1 | grep -q ' 200' && echo ok
          echo "==> negative asset check (expect 400)"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE/api/agent/download/evil.exe")
          [ "$code" = "400" ] && echo ok
