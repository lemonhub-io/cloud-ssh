name: Deploy to Cloudflare Workers

on:
  push:
    branches: [test, main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "AGENTS.md"

jobs:
  deploy:
    if: github.repository_owner == 'vexuni'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa  # v4
        with:
          version: "11.8.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Type check
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Browser E2E and accessibility tests
        run: pnpm run test:e2e

      - name: Build frontend and deploy (test)
        if: github.ref == 'refs/heads/test'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:test

      - name: Sync TURN API token secret (test)
        if: github.ref == 'refs/heads/test'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
        run: |
          if [ -z "$CF_TURN_API_TOKEN" ]; then
            echo "CF_TURN_API_TOKEN secret not configured; skipping"
          else
            printf '%s' "$CF_TURN_API_TOKEN" | pnpm exec wrangler secret put TURN_API_TOKEN --env test
          fi

      - name: Build frontend and deploy (production)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

      - name: Sync TURN API token secret (production)
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
        run: |
          if [ -z "$CF_TURN_API_TOKEN" ]; then
            echo "CF_TURN_API_TOKEN secret not configured; skipping"
          else
            printf '%s' "$CF_TURN_API_TOKEN" | pnpm exec wrangler secret put TURN_API_TOKEN
          fi

      - name: Post-deploy smoke check (production)
        if: github.ref == 'refs/heads/main'
        run: |
          # 生产只走自定义域名（workers.dev 不用于生产）。注意：zone 安全设置
          # 可能对 GitHub 机房 IP 弹 CF 托管挑战（403 "Just a moment"）——
          # 挑战只证明边缘可达，不算失败但会打 WARN；真正的失败是 5xx/超时/000。
          BASE="https://ssh.lemonhub.online"
          fail=0
          check() { # $1=label $2=path $3=expect-status $4=grep-pattern(optional)
            local code body
            body=$(curl -s --max-time 30 -w '\n%{http_code}' "$BASE$2" || true)
            code=$(echo "$body" | tail -1)
            body=$(echo "$body" | sed '$d')
            if [ "$code" = "403" ] && echo "$body" | grep -qi 'challenge'; then
              echo "WARN $1: CF managed challenge (edge reachable, runner IP challenged)"
              return
            fi
            if [ "$code" != "$3" ]; then
              echo "FAIL $1: status=$code (expect $3)"
              echo "$body" | head -5
              fail=1
              return
            fi
            if [ -n "$4" ] && ! echo "$body" | grep -q "$4"; then
              echo "FAIL $1: body missing '$4'"
              echo "$body" | head -5
              fail=1
              return
            fi
            echo "PASS $1 (status=$code)"
          }
          check "health"        "/api/health"  200 '"status":"ok"'
          check "config p2p"    "/api/config"  200 '"p2pEnabled":true'
          check "install.sh"    "/install.sh"  200 '#!/bin/sh'
          check "install.ps1"   "/install.ps1" 200 'param('
          check "bad asset 400" "/api/agent/download/evil.exe" 400
          echo "==> HEAD download proxy"
          hcode=$(curl -sI -o /dev/null -w '%{http_code}' --max-time 60 "$BASE/api/agent/download/cloudssh-agent-linux-x64" || true)
          if [ "$hcode" = "200" ]; then echo "PASS download proxy (status=$hcode)";
          elif [ "$hcode" = "403" ]; then echo "WARN download proxy: CF managed challenge";
          else echo "FAIL download proxy: status=$hcode"; fail=1; fi
          exit $fail
